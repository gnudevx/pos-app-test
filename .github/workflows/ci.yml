name: POS App CI/CD

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    name: Backend — Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backend exists
        id: check
        run: |
          [ -f "backend/requirements.txt" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Install + test
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          pip install -r requirements.txt -q
          pytest tests/ -v --tb=short

  frontend-test:
    name: Frontend — Jest + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend exists
        id: check
        run: |
          [ -f "frontend/package.json" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Install + test + build
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
          npx jest --passWithNoTests --coverage
          npm run build

  docker-build:
    name: Docker — Build & Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose exists
        id: check
        run: |
          [ -f "docker-compose.yml" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Build images
        if: steps.check.outputs.exists == 'true'
        run: docker compose build
      - name: Smoke test — backend health
        if: steps.check.outputs.exists == 'true'
        run: |
          docker compose up -d db backend
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          docker compose down
  
  lint:
    name: Lint — ESLint + Flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Flake8
        run: |
          pip install flake8 -q
          [ -d "backend/app" ] && flake8 backend/app --max-line-length=120 || true
      - name: ESLint
        run: |
          [ -f "frontend/package.json" ] && cd frontend && npx eslint src --max-warnings 0 || true
  
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (frontend)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm install -g vercel -q
          vercel deploy frontend/ --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Deploy backend (Railway/Render)
        run: |
          echo "TODO: add Railway/Render deploy step"

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check e2e exists
        id: check
        run: |
          [ -d "e2e" ] && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Run Playwright
        if: steps.check.outputs.exists == 'true'
        run: |
          cd e2e && npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}