name: POS App CI/CD

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:

  backend-test:
    name: Backend — Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check backend exists
        id: check
        run: |
          [ -f "src/backend/requirements.txt" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd src/backend
          pip install -r requirements.txt -q

      - name: Run pytest
        if: steps.check.outputs.exists == 'true'
        run: |
          cd src/backend
          PYTHONPATH=$(pwd) python -m pytest tests/ -v --tb=short

  frontend-test:
    name: Frontend — Jest + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend exists
        id: check
        run: |
          [ -f "src/frontend/package.json" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: cd src/frontend && npm install

      - name: Run Jest
        if: steps.check.outputs.exists == 'true'
        run: cd src/frontend && npx jest --passWithNoTests

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: cd src/frontend && npm run build

      - name: Upload build artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/dist
          retention-days: 1

  lint:
    name: Lint — Flake8 + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Flake8 (backend)
        run: |
          pip install flake8 -q
          if [ -d "src/backend/app" ]; then
            flake8 src/backend/app --max-line-length=120
            echo "Flake8 passed"
          else
            echo "No backend code yet — skip"
          fi

      - name: ESLint (frontend)
        run: |
          if [ -f "src/frontend/package.json" ]; then
            cd src/frontend && npm ci --silent
            npx eslint src --max-warnings 0
            echo "ESLint passed"
          else
            echo "No frontend code yet — skip"
          fi

  docker-build:
    name: Docker — Build and Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          [ -f "src/backend/Dockerfile" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Build backend image
        if: steps.check.outputs.exists == 'true'
        run: docker build -t pos-backend:ci src/backend

      - name: Smoke test — container starts
        if: steps.check.outputs.exists == 'true'
        run: |
          docker run --rm pos-backend:ci \
            python -c "from app.main import app; print('Backend import OK')"

  deploy-staging:
    name: Deploy — Staging (Vercel)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/dist
        continue-on-error: true

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}   # ← truyền qua env
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then             # ← kiểm tra trong shell
            echo "VERCEL_TOKEN not set — skip deploy"
            exit 0
          fi
          npm install -g vercel -q
          vercel deploy src/frontend/dist \
            --token="$VERCEL_TOKEN" \
            --yes

      - name: Backend deploy placeholder
        run: |
          echo "TODO: Railway/Render deploy"
          echo "Add RAILWAY_TOKEN secret + railway CLI when ready"

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check e2e folder exists
        id: check
        run: |
          [ -d "e2e" ] \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        if: steps.check.outputs.exists == 'true'
        run: |
          cd e2e && npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.check.outputs.exists == 'true'
        run: cd e2e && npx playwright test
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}