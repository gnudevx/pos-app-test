version: "3.9"

services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./src/backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pos:pos123@db:5432/posdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./src/frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./src/frontend/src:/app/src

volumes:
  pgdata: